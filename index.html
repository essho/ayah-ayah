  function showError(msg){ errorText.textContent = msg; errorModal.style.display = 'flex'; }

    localStorage.setItem('lastSurah', currentSurah);

    localStorage.setItem('translationLang', currentLang);

  function setFontSize(){ ayahEl.style.fontSize = fontSize + 'px'; }

  function hexToRgba(hex, alpha){
    let r=0,g=0,b=0;
    if(hex.length===4){ r=parseInt(hex[1]+hex[1],16); g=parseInt(hex[2]+hex[2],16); b=parseInt(hex[3]+hex[3],16); }
    else if(hex.length===7){ r=parseInt(hex.slice(1,3),16); g=parseInt(hex.slice(3,5),16); b=parseInt(hex.slice(5,7),16); }
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }
function getContrastTextColor(hex){
  // يقبل #fff أو #ffffff
  let r=0,g=0,b=0;
  if (hex.length === 4) {
    r = parseInt(hex[1] + hex[1], 16);
    g = parseInt(hex[2] + hex[2], 16);
    b = parseInt(hex[3] + hex[3], 16);
  } else if (hex.length === 7) {
    r = parseInt(hex.slice(1,3), 16);
    g = parseInt(hex.slice(3,5), 16);
    b = parseInt(hex.slice(5,7), 16);
  }
  // تحويل إلى sRGB خطي ثم حساب اللمعان النسبي (WCAG)
  const sr = r/255, sg = g/255, sb = b/255;
  const lin = c => (c <= 0.03928) ? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
  const L = 0.2126*lin(sr) + 0.7152*lin(sg) + 0.0722*lin(sb);

  // قارن التباين مع الأبيض والأسود واختر الأقوى
  const contrastWhite = (1.05) / (L + 0.05);
  const contrastBlack = (L + 0.05) / 0.05;
  return contrastWhite >= contrastBlack ? '#ffffff' : '#000000';
}

  async function loadSurahs(){
    try{
      const res = await fetch('./quran_data.json');
      const allSurahsData = await res.json();
      surahs = allSurahsData.map(s=>({ number: s.number, titleAr: s.name, count: s.numberOfAyahs }));
      fullQuranData = allSurahsData;
      renderQuickSurahList();
      loadAyah();
    }catch(err){ console.error(err); showError("فشل تحميل ملف القرآن."); }
  }

  function setActiveItem(listId, activeIndex){
    const list = document.getElementById(listId);
    if(!list) return;
    list.querySelectorAll('div').forEach((item,i)=>{
      item.classList.toggle('selected-item', i===activeIndex);
    });
    const active = list.querySelector('.selected-item');
    if(active){ active.scrollIntoView({behavior:'smooth',block:'center'}); }
  }

  function renderQuickSurahList(){
    quickSurahList.innerHTML='';
    surahs.forEach((s, index)=>{
      const el = document.createElement('div');
      el.textContent = s.titleAr;
      el.onclick = ()=>{
        currentSurah = index+1; currentAyah = 1;
        handleManualAyahChange(); renderQuickAyahList(); ayahPickerModal.style.display='none'; saveState();
      };
      quickSurahList.appendChild(el);
    });
    setActiveItem('quickSurahList', currentSurah-1);
    renderQuickAyahList();
  }

  function renderQuickAyahList(){
    quickAyahList.innerHTML='';
    const surahIndex = surahs.findIndex(s=>s.number===currentSurah);
    const count = surahs[surahIndex].count;
    for(let i=1;i<=count;i++){
      const el = document.createElement('div');
      el.textContent = `آية ${i}`;
      el.onclick = ()=>{ currentAyah=i; handleManualAyahChange(); ayahPickerModal.style.display='none'; saveState(); };
      quickAyahList.appendChild(el);
    }
    setActiveItem('quickAyahList', currentAyah-1);
  }

  function handleManualAyahChange(){
    audioPlayer.pause();
    audioBtn.textContent = '🔊';
    isPlaying = false;
    currentRepeatCount = 0;
    loadAyah();
  }

  async function loadAyah(){
    setFontSize();
    updateColorState();
    try{
      if(!fullQuranData) await loadSurahs();
      const surahData = fullQuranData.find(s=>s.number===currentSurah);
      const ayahData = surahData.ayahs.find(a=>a.numberInSurah===currentAyah);
      if(!surahData || !ayahData) throw new Error("Ayah/Surah not found");

      const transRes = await fetch(`./translation/${currentLang}/${currentLang}_translation_${currentSurah}.json`);
      if(!transRes.ok) throw new Error("Translation file not found");
      const transData = await transRes.json();

      // بسملة — استثناء الفاتحة (1) والتوبة (9)
      bismillahEl.innerHTML = '';
      if(currentAyah===1 && currentSurah!==1 && currentSurah!==9){
        bismillahEl.innerHTML = 'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ';
      }

      let finalText = isTajweedEnabled ? ayahData.qpc_tajweed_text : ayahData.text;
      finalText = finalText.replace(/\s\d+$/, ''); // إزالة رقم الآية في نهاية السطر
      const transText = transData.verse[`verse_${currentAyah}`] || '...';

      ayahEl.innerHTML = finalText;
      translationEl.textContent = transText;
      expandedTranslation.textContent = transText;

      const surahName = surahs.find(s=>s.number===currentSurah)?.titleAr || '';
      openAyahPicker.textContent = `${surahName} - ${currentAyah}`;
    }catch(err){
      console.error(err);
      showError("حدث خطأ في تحميل البيانات. تأكد من الملفات والمسارات.");
      ayahEl.textContent = 'حدث خطأ في تحميل البيانات.';
      translationEl.textContent = '...';
    }
  }

  function nextAyahOrSurah(){
    const max = surahs[currentSurah-1].count;
    if(currentAyah<max){ currentAyah++; }
    else if(currentSurah<114){ currentSurah++; currentAyah=1; }
    saveState(); loadAyah();
  }

  function playCurrentAyah(){
    const surahStr = currentSurah.toString().padStart(3,'0');
    const ayahStr = currentAyah.toString().padStart(3,'0');
    audioPlayer.src = `audio/${surahStr}/${ayahStr}.mp3`;
    audioPlayer.play().then(()=>{
      isPlaying = true; audioBtn.textContent='⏸️';
    }).catch(e=>{
      console.error("فشل تشغيل الصوت:", e);
      showError("فشل تشغيل الصوت. تأكد من وجود ملف الصوت في المسار المحدد.");
      isPlaying = false; audioBtn.textContent='🔊'; currentRepeatCount=0;
    });
  }

  audioPlayer.onended = ()=>{
    if(isContinuousPlay){
      nextAyahOrSurah(); playCurrentAyah();
    }else if(repeatNumber>1 && currentRepeatCount < (repeatNumber-1)){
      currentRepeatCount++; playCurrentAyah();
    }else{
      isPlaying=false; audioBtn.textContent='🔊'; currentRepeatCount=0;
    }
  };

  // البحث (باستخدام imlaei_simple_text + highlight)
  function escapeHTML(s){ return s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function performSearch(query){
    if(!fullQuranData){ searchResults.innerHTML='<div style="text-align:center;padding:1rem;">جاري تحميل البيانات...</div>'; return; }
    if(query.length<2){ searchResults.innerHTML='<div style="text-align:center;padding:1rem;">اكتب كلمتين على الأقل للبحث.</div>'; return; }

    const results=[];
    fullQuranData.forEach(surah=>{
      surah.ayahs.forEach(ayah=>{
        if(ayah.imlaei_simple_text.includes(query)){
          results.push({
            surahTitle: surah.name,
            surahIndex: surah.number,
            ayahNumber: ayah.numberInSurah,
            verseText: ayah.text,
            simpleText: ayah.imlaei_simple_text
          });
        }
      });
    });
    displaySearchResults(results, query);
  }
  function displaySearchResults(results, query){
    searchResults.innerHTML='';
    if(results.length===0){ searchResults.innerHTML='<div style="text-align:center;padding:1rem;">لا توجد نتائج.</div>'; return; }
    results.forEach(r=>{
      const el=document.createElement('div');
      const highlighted = escapeHTML(r.simpleText).replaceAll(query, `<mark>${escapeHTML(query)}</mark>`);
      el.innerHTML = `
        <div class="search-surah-info" style="opacity:0.9;margin-bottom:0.25rem;">
          ${r.surahTitle} - آية ${r.ayahNumber}
        </div>
        <div class="search-text-snippet" style="opacity:0.95;">
          ${highlighted}
        </div>
      `;
      el.onclick=()=>{ currentSurah=r.surahIndex; currentAyah=r.ayahNumber; handleManualAyahChange(); searchModal.style.display='none'; saveState(); };
      searchResults.appendChild(el);
    });
  }

  // لون نص مقابل للخلفية + تلوين جميع المودالات (بما فيها البحث)
function updateColorState() {
  const allTextElements = document.querySelectorAll('.ayah-text, .translation-text');
  const bgColor = bgColorInput.value.toLowerCase();

  // طبّق لون الخلفية أولًا
  document.body.style.backgroundColor = bgColor;

  // لون نص متباين ذكي لا يتعارض مع ألوان التجويد
  const contrast = getContrastTextColor(bgColor);

  const bgHex = bgColorInput.value.toLowerCase();
  document.body.style.backgroundColor = bgHex;

  // لون واجهة موحّد: مع التجويد = تباين ذكي، بدون تجويد = من اختيار المستخدم
  const uiColor = isTajweedEnabled ? getContrastTextColor(bgHex) : textColorInput.value;
  document.documentElement.style.setProperty('--ui-text-color', uiColor);

  if (isTajweedEnabled) {
    // لا تغيّر ألوان rule<>, لكن اجعل النص الأساسي والشرح واضحين
    textColorInput.disabled = true;
    ayahEl.style.color = contrast;        // يطبّق فقط على النص خارج عناصر التجويد الملوّنة
    translationEl.style.color = contrast; // الترجمة كلها
	
  } else {
    textColorInput.disabled = false;
    ayahEl.style.color = textColorInput.value;
    translationEl.style.color = textColorInput.value;
  }

  // حافظ على وضوح الأيقونات/العداد بنفس طريقة رقم التكرار
  repeatIcon.style.color = contrast;
  repeatCountSpan.style.color = contrast;
  
  // ... (أكمل هنا باقي شغلك الموجود أصلًا لتلوين المودالات والقوائم)
  const modalBg = hexToRgba(bgColor, 0.2);
  const listBg  = hexToRgba(bgColor, 0.4);
  const listHover = hexToRgba(bgColor, 0.6);
  const selectedItemBg = hexToRgba(bgColor, 0.8);

  document.getElementById('settingsModal').querySelector('.modal-content').style.backgroundColor = modalBg;
  document.getElementById('ayahPickerModal').querySelector('.modal-content').style.backgroundColor = modalBg;
  document.getElementById('expandedTranslationModal').querySelector('.modal-content').style.backgroundColor = modalBg;
  document.getElementById('errorModal').querySelector('.modal-content').style.backgroundColor = modalBg;
  document.getElementById('searchModal').querySelector('.modal-content').style.backgroundColor = modalBg;

  document.querySelectorAll('.scrollable-select').forEach(list => {
    list.style.backgroundColor = listBg;
    list.querySelectorAll('div').forEach(item => {
      item.onmouseover = () => { item.style.backgroundColor = listHover; };
      item.onmouseout  = () => { if (!item.classList.contains('selected-item')) item.style.backgroundColor = 'transparent'; };
    });
  });
  document.querySelectorAll('.scrollable-select .selected-item').forEach(item => {
    item.style.backgroundColor = selectedItemBg;
  });
  }


  function updateRepeatIcon(){
    // ظهور/اختفاء الرقم (واحد فقط)
    if(!isContinuousPlay && repeatNumber > 1){
      repeatCountSpan.textContent = repeatNumber;
      repeatCountSpan.style.display = 'inline';
    }else{
      repeatCountSpan.style.display = 'none';
    }
    // شكل الأيقونة
    repeatIcon.textContent = isContinuousPlay ? '♾️' : '🔁';
  }

  // الأحداث
  translationEl.onclick = ()=>{ expandedTranslationModal.style.display='flex'; };
  settingsBtn.onclick = ()=>{
    settingsModal.style.display='flex';
    fontFamilySelect.value = getComputedStyle(document.body).fontFamily || "'Amiri', serif";
    translationSelect.value = currentLang;
  };
  openAyahPicker.onclick = ()=>{
    ayahPickerModal.style.display='flex';
    setActiveItem('quickSurahList', currentSurah-1);
    setActiveItem('quickAyahList', currentAyah-1);
  };
  searchBtn.onclick = ()=>{
    searchModal.style.display='flex';
    if(!fullQuranData){ loadSurahs(); }
    searchInput.focus();
  };
  searchInput.addEventListener('input', e=>performSearch(e.target.value.trim()));
  fontInc.onclick = ()=>{ fontSize+=2; setFontSize(); saveState(); };
  fontDec.onclick = ()=>{ fontSize=Math.max(12,fontSize-2); setFontSize(); saveState(); };

  nextBtn.onclick = ()=>{ nextAyahOrSurah(); handleManualAyahChange(); };
  prevBtn.onclick = ()=>{
    if(currentAyah>1) currentAyah--;
    else if(currentSurah>1){ currentSurah--; currentAyah = surahs[currentSurah-1].count; }
    handleManualAyahChange(); saveState();
  };

  translationSelect.addEventListener('change', ()=>{
    currentLang = translationSelect.value;
    loadAyah(); saveState();
  });

  audioBtn.addEventListener('click', ()=>{
    if(!isPlaying){
      currentRepeatCount = 0;
      playCurrentAyah();
    }else{
      audioPlayer.pause(); isPlaying=false; audioBtn.textContent='🔊';
    }
  });

  // التبديل بين "تكرار" و"مستمر" من الأيقونة فقط
  repeatBtn.addEventListener('click', ()=>{
    isContinuousPlay = !isContinuousPlay;
    updateRepeatIcon(); saveState();

    // إعادة التشغيل لتطبيق المود الجديد (لو كان شغال)
    if(isPlaying){
      audioPlayer.pause();
      currentRepeatCount = 0;
      playCurrentAyah();
    }
  });

  toggleTajweed.addEventListener('change', ()=>{
    isTajweedEnabled = toggleTajweed.checked;
    localStorage.setItem('tajweedEnabled', isTajweedEnabled);
    loadAyah();
  });

  repeatNumberInput.addEventListener('change', ()=>{
    const val = parseInt(repeatNumberInput.value,10);
    repeatNumber = (isNaN(val) || val<1) ? 1 : val;
    repeatNumberInput.value = repeatNumber;
    updateRepeatIcon(); saveState();
  });

  textColorInput.addEventListener('input', updateColorState);
  fontFamilySelect.addEventListener('change', ()=>{ document.body.style.fontFamily = fontFamilySelect.value;  document.documentElement.style.setProperty('--ui-font-family', fontFamilySelect.value);});
  bgColorInput.addEventListener('input', updateColorState);

  // تحميل مبدئي
  toggleTajweed.checked = isTajweedEnabled;
  repeatNumberInput.value = repeatNumber;
  updateRepeatIcon();
  setFontSize();
  loadSurahs();
</script>
</body>
</html>
